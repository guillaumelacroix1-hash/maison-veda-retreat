<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--font-sans); background: var(--veda-dark); padding: 32px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .veda-btn { transition: background-color .3s, color .3s, border-color .3s; }
</style>
</head>
<body>
  <button class="veda-btn veda-btn--primary">Réservation</button>
  <button class="veda-btn veda-btn--ghost">Découvrir</button>
  <button class="veda-btn veda-btn--dark" style="border:1px solid rgba(255,255,255,.15)">Réserver ma place</button>
</body>
</html>
