<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--font-sans); background: var(--veda-dark); padding: 34px 40px; display: flex; align-items: center; gap: 22px; min-height: 200px; }
  .mark { height: 92px; width: auto; }
  .lock { display: flex; flex-direction: column; justify-content: center; line-height: 1; }
  .name { font-family: var(--font-heading); font-size: 30px; font-weight: 500; letter-spacing: 0.08em; color: var(--veda-gold); }
  .sub { font-family: var(--font-sans); font-size: 13px; font-weight: 300; letter-spacing: 0.35em; color: rgba(245,245,245,.8); margin-top: 9px; }
  .note { margin-left: auto; max-width: 180px; font-size: 11px; font-weight: 300; line-height: 1.6; color: rgba(245,245,245,.45); border-left: 1px solid rgba(255,255,255,.12); padding-left: 18px; }
</style>
</head>
<body>
  <img class="mark" src="../assets/logo-veda-mandala-gold.svg" alt="Mandala Sri Yantra">
  <div class="lock">
    <div class="name">LA MAISON VEDA</div>
    <div class="sub">LAKE VILLAS &amp; YOGA</div>
  </div>
  <div class="note">Playfair 500 · 0.08em<br>au-dessus d'Inter 300 · 0.35em</div>
</body>
</html>
