<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--font-sans); background: var(--paper-cream); padding: 30px 34px; }
  .lbl { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600; color: var(--fg-on-light-subtle); margin-bottom: 16px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 26px; }
  .row:last-child { margin-bottom: 0; }
  .pill { padding: 7px 18px; border-radius: var(--radius-full); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .gold { background: var(--veda-gold); color: var(--veda-dark); }
  .dark { background: var(--veda-dark); color: #fff; }
  .gold-soft { background: var(--gold-tint-20); color: var(--veda-gold); }
  .outline { border: 1px solid var(--border-gold-40, rgba(185,155,100,.4)); color: var(--veda-gold); background: transparent; }
  .date { padding: 8px 24px; border: 1px solid var(--border-gold-60); border-radius: var(--radius-full); font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--veda-dark); }
</style>
</head>
<body>
  <div class="lbl">Badges & pills</div>
  <div class="row">
    <span class="pill gold">Inclus</span>
    <span class="pill dark">Standard</span>
    <span class="pill gold-soft">Premium</span>
    <span class="pill outline">Nouveau</span>
  </div>
  <div class="lbl">Eyebrow date (hero)</div>
  <div class="row">
    <span class="date">7 au 13 février 2027</span>
  </div>
</body>
</html>
