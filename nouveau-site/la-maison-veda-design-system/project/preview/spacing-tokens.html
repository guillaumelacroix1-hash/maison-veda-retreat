<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--font-sans); background: #fff; padding: 26px 32px; }
  .lbl { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600; color: var(--veda-gold); margin-bottom: 14px; }
  .bars { display: flex; flex-direction: column; gap: 10px; }
  .bar { display: flex; align-items: center; gap: 14px; }
  .fill { height: 16px; background: var(--veda-gold); border-radius: 3px; }
  .nm { font-size: 12px; color: var(--veda-dark); font-weight: 500; width: 130px; }
  .px { font-size: 11px; color: var(--fg-on-light-subtle); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="lbl">Espacements & rythme</div>
  <div class="bars">
    <div class="bar"><div class="nm">page-x (px-6)</div><div class="fill" style="width:24px"></div><div class="px">24px</div></div>
    <div class="bar"><div class="nm">grid-gap (gap-8)</div><div class="fill" style="width:32px"></div><div class="px">32px</div></div>
    <div class="bar"><div class="nm">section-y-sm</div><div class="fill" style="width:96px"></div><div class="px">96px · py-24</div></div>
    <div class="bar"><div class="nm">section-y</div><div class="fill" style="width:128px"></div><div class="px">128px · py-32</div></div>
    <div class="bar"><div class="nm">container-max</div><div class="fill" style="width:240px;opacity:.4"></div><div class="px">max-w-7xl · 1280px</div></div>
  </div>
</body>
</html>
