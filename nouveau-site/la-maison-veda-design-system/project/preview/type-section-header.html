<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--font-sans); background: var(--veda-dark); padding: 34px 38px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600; color: var(--veda-gold); margin-bottom: 16px; }
  h2 { font-family: var(--font-heading); font-weight: 400; font-size: 48px; line-height: 1.1; color: var(--veda-light); }
  h2 .ac { font-style: italic; color: var(--veda-gold); }
  .divider { width: 96px; height: 1px; background: var(--veda-gold); margin: 22px 0; }
  p { color: rgba(245,245,245,.7); font-weight: 300; line-height: 1.625; max-width: 46ch; font-size: 15px; }
</style>
</head>
<body>
  <div class="eyebrow">L'Expérience</div>
  <h2>Le Programme de <span class="ac">Votre Retraite</span></h2>
  <div class="divider"></div>
  <p>Sadhana au lever du soleil face au lac, suivi de cours de yoga Kundalini ou Hatha pour éveiller le corps et l'esprit.</p>
</body>
</html>
