<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--font-heading); background: #fff; padding: 26px 32px; color: var(--veda-dark); }
  .line { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid rgba(0,0,0,.05); padding: 9px 0; }
  .line:last-child { border-bottom: none; }
  .spec { font-weight: 400; line-height: 1; white-space: nowrap; }
  .tag { font-family: var(--font-sans); font-size: 11px; color: var(--fg-on-light-subtle); margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>
  <div class="line"><div class="spec" style="font-size:46px">Retraite</div><div class="tag">Hero h1 · 112px / 1.1</div></div>
  <div class="line"><div class="spec" style="font-size:34px">Le Programme</div><div class="tag">Display h2 · 60px</div></div>
  <div class="line"><div class="spec" style="font-size:24px">Lake House</div><div class="tag">Villa · 36px</div></div>
  <div class="line"><div class="spec" style="font-size:18px">Pension complète</div><div class="tag">Card h4 · 20px</div></div>
  <div class="line"><div class="spec" style="font-family:var(--font-sans);font-weight:300;font-size:16px">Paragraphe courant</div><div class="tag">Body · 16px / light</div></div>
  <div class="line"><div class="spec" style="font-family:var(--font-sans);font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--veda-gold)">L'Expérience</div><div class="tag">Eyebrow · 12px / 0.2em</div></div>
</body>
</html>
