<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 854px; overflow: hidden; }
  body { display: flex; font-family: var(--font-heading); }
  .main { flex: 1; background: var(--veda-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
  .main img { width: 300px; height: auto; }
  .name { text-align: center; line-height: 1; }
  .name .l1 { font-size: 76px; font-weight: 500; letter-spacing: 0.06em; color: var(--veda-gold); }
  .name .l2 { font-family: var(--font-sans); font-size: 30px; font-weight: 300; letter-spacing: 0.32em; color: rgba(245,245,245,.85); margin-top: 22px; }
  .strip { width: 150px; display: flex; flex-direction: column; }
  .strip > div { flex: 1; }
</style>
</head>
<body>
  <div class="main">
    <img src="assets/logo-veda-mandala-gold.svg" alt="La Maison Veda">
    <div class="name">
      <div class="l1">LA MAISON VEDA</div>
      <div class="l2">LAKE VILLAS &amp; YOGA</div>
    </div>
  </div>
  <div class="strip">
    <div style="background:#f5f5f5"></div>
    <div style="background:#b99b64"></div>
    <div style="background:#b49174"></div>
  </div>
</body>
</html>
